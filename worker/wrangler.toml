# The tiny relay between the site's Ask panel and the Gemini API.
# Deploy: npx wrangler deploy --config worker/wrangler.toml
# Secret: npx wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
name = "tahtitorni-ask"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Fallback chain of rolling aliases, so retired names can't break the
# assistant; free-tier daily quotas are per model, so when one runs dry,
# hangs or is overloaded the worker steps down to the next. Lite goes
# first since 2026-09-02: the flash alias was answering 503 "high demand"
# or hanging past 25s on every request, and lite handles grounded Q&A
# well. Swap the order back once flash is dependable again.
[vars]
MODELS = "gemini-flash-lite-latest,gemini-flash-latest"

# Per-IP rate limit: 8 requests per minute
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
